name: Build polaris kernel (DSI PLL fix)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  KVER: "7.1-rc1"
  KDIR: "linux-7.1-rc1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            xz-utils cpio ca-certificates curl

      - name: Show toolchain
        run: |
          aarch64-linux-gnu-gcc --version | head -1
          echo "cpus: $(nproc)"
          df -h /

      - name: Download kernel source
        run: |
          set -e
          # pmOS 实际源是 sdm845-mainline fork（含 sdm845 显示/设备补丁），
          # 原版 torvalds 源缺这些补丁导致显示链路静默不聚合
          git clone --depth 1 --branch sdm845-7.1-rc1-r0 \
            https://gitlab.com/sdm845-mainline/linux.git "$KDIR"
          test -d "$KDIR" || { echo "ERROR: $KDIR not found"; ls; exit 1; }
          cd "$KDIR"
          echo "checked out: $(make -s kernelversion)"
          echo "source ready: $KDIR"

      - name: Apply extracted defconfig
        run: |
          cp config.txt "$KDIR/.config"
          echo "--- key options from original kernel ---"
          grep -E "^CONFIG_LOCALVERSION=|^CONFIG_DRM_MSM=|^CONFIG_DRM_MSM_DSI=" "$KDIR/.config"

      - name: Patch DSI 10nm PHY (power up digital top with PLL bias)
        run: |
          cd "$KDIR/drivers/gpu/drm/msm/dsi/phy"
          python3 "$GITHUB_WORKSPACE/patch_dsi.py"
          echo "--- patched line ---"
          grep -n "BIT(6) | BIT(5)" dsi_phy_10nm.c

      - name: Patch panel NT35596S (DCS init in .enable, after DSI host enabled)
        run: |
          cd "$KDIR/drivers/gpu/drm/panel"
          python3 "$GITHUB_WORKSPACE/patch_panel.py"
          echo "--- patched funcs ---"
          grep -n "nt35596s_panel_enable\|\.enable =" panel-novatek-nt35596s.c

      - name: Configure (olddefconfig, strip debug info)
        run: |
          cd "$KDIR"
          # 关掉调试信息，大幅缩短编译时间；不影响任何功能
          ./scripts/config --file .config \
            -d DEBUG_INFO -d DEBUG_INFO_DWARF5 \
            -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES \
            -d DEBUG_INFO_REDUCED -d GDB_SCRIPTS
          # 关键：安卓 defconfig 遗留的“编译期强制 lockdown”会让未签名模块全部被拒
          # （modprobe: Operation not permitted / Lockdown: unsigned module loading is restricted），
          # 必须关掉，否则 WiFi/触摸等模块永远加载不了
          ./scripts/config --file .config \
            -d LOCK_DOWN_KERNEL_FORCE_INTEGRITY \
            -d LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY \
            -e LOCK_DOWN_KERNEL_FORCE_NONE \
            -d MODULE_SIG_FORCE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "--- resulting options ---"
          grep -E "^CONFIG_(CC_IS|LD_IS|LOCALVERSION|DRM_MSM_DSI|DEBUG_INFO)=" .config || true
          echo "--- lockdown / module sig ---"
          grep -E "LOCK_DOWN|MODULE_SIG_FORCE" .config
          # 硬断言：必须出现 FORCE_NONE=y 且没有 FORCE_INTEGRITY
          grep -q "^CONFIG_LOCK_DOWN_KERNEL_FORCE_NONE=y" .config || { echo "FATAL: lockdown still forced"; exit 1; }
          ! grep -q "^CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y" .config || { echo "FATAL: integrity forced"; exit 1; }

      - name: Build Image
        run: |
          set -o pipefail
          cd "$KDIR"
          time make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image 2>&1 | tail -60

      - name: Verify Image
        run: |
          IMG="$KDIR/arch/arm64/boot/Image"
          ls -lh "$IMG"
          python3 -c "
          import sys
          p='$IMG'
          d=open(p,'rb').read(64)
          magic=int.from_bytes(d[56:60],'little')
          size=int.from_bytes(d[16:24],'little')
          print('arm64 magic:', hex(magic), 'OK' if magic==0x644d5241 else 'BAD')
          print('image_size :', size, '(%.1f MB)'%(size/1048576))
          assert magic==0x644d5241, 'not an arm64 Image'
          assert size > 10*1048576, 'image too small'
          "

      - name: Upload Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaris-Image-${{ env.KVER }}
          path: ${{ env.KDIR }}/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: Build modules
        run: |
          set -o pipefail
          cd "$KDIR"
          time make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" modules 2>&1 | tail -40

      - name: Install and package modules
        run: |
          set -e
          cd "$KDIR"
          REL=$(make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)
          echo "release=$REL"
          rm -rf "$GITHUB_WORKSPACE/mods"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/mods" INSTALL_MOD_STRIP=1 modules_install
          D="$GITHUB_WORKSPACE/mods/lib/modules/$REL"
          ls "$D" | head
          echo "ko count: $(find "$D" -name '*.ko*' | wc -l)"
          echo "wifi/remoteproc 关键模块:"
          find "$D" -name 'ath10k*' -o -name 'mac80211*' -o -name 'cfg80211*' -o -name 'qcom_q6v5*' -o -name 'qcom_wcnss*' -o -name 'qrtr*' | head -20
          rm -f "$D/build" "$D/source"
          tar czf "$GITHUB_WORKSPACE/modules-$REL.tar.gz" -C "$GITHUB_WORKSPACE/mods" lib/modules
          ls -lh "$GITHUB_WORKSPACE/modules-$REL.tar.gz"
          echo "MODREL=$REL" > "$GITHUB_WORKSPACE/modrel.txt"

      - name: Upload modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaris-modules-${{ env.KVER }}
          path: ${{ github.workspace }}/modules-*.tar.gz
          if-no-files-found: error
          retention-days: 7
